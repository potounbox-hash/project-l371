<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>

<title>DualPlay GamePad</title>

<style>

/* =====================================================
   BASE
===================================================== */

* {
    box-sizing: border-box;
    user-select: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
}

html,
body {

    margin: 0;

    width: 100%;
    height: 100%;

    overflow: hidden;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    color: white;

    touch-action: none;

}


/* =====================================================
   FOND ANIMÉ
===================================================== */

body {

    background:
        linear-gradient(
            125deg,
            #171b45,
            #39276b,
            #176b78,
            #233d7a,
            #531f63
        );

    background-size: 500% 500%;

    animation:
        backgroundMove 16s ease infinite;

}


@keyframes backgroundMove {

    0% {
        background-position: 0% 50%;
    }

    25% {
        background-position: 100% 30%;
    }

    50% {
        background-position: 100% 80%;
    }

    75% {
        background-position: 20% 100%;
    }

    100% {
        background-position: 0% 50%;
    }

}


/* lumière ambiante */

body::before {

    content: "";

    position: fixed;

    inset: -30%;

    pointer-events: none;

    background:
        radial-gradient(
            circle at 25% 40%,
            rgba(90,150,255,.25),
            transparent 30%
        ),
        radial-gradient(
            circle at 75% 60%,
            rgba(255,70,190,.22),
            transparent 30%
        );

    animation:
        ambientMove 10s ease-in-out infinite alternate;

}


@keyframes ambientMove {

    from {
        transform: scale(1);
    }

    to {
        transform: scale(1.25) rotate(8deg);
    }

}


/* =====================================================
   ÉCRAN DE CONNEXION
===================================================== */

#connectScreen {

    position: fixed;

    inset: 0;

    display: flex;

    align-items: center;
    justify-content: center;

    z-index: 100;

}


.connectBox {

    width: 420px;

    max-width: 90%;

    padding: 38px;

    text-align: center;

    border-radius: 32px;

    background:
        rgba(18,22,42,.82);

    border:
        1px solid
        rgba(255,255,255,.15);

    backdrop-filter:
        blur(25px);

    box-shadow:
        0 30px 80px
        rgba(0,0,0,.45),
        inset 0 1px 0
        rgba(255,255,255,.12);

}


.connectBox h1 {

    margin: 0;

    font-size: 42px;

    letter-spacing: -2px;

}


.connectBox p {

    color:
        rgba(255,255,255,.6);

}


#codeInput {

    width: 100%;

    height: 60px;

    margin-top: 18px;

    border: none;

    outline: none;

    border-radius: 18px;

    background:
        rgba(0,0,0,.3);

    color: white;

    text-align: center;

    font-size: 28px;

    font-weight: bold;

    letter-spacing: 8px;

    box-shadow:
        inset 0 4px 10px
        rgba(0,0,0,.4);

}


#connectButton {

    width: 100%;

    height: 58px;

    margin-top: 15px;

    border: none;

    border-radius: 18px;

    color: white;

    font-size: 16px;

    font-weight: bold;

    background:
        linear-gradient(
            145deg,
            #65a9ff,
            #3974e8
        );

    box-shadow:
        0 8px 0 #2454aa,
        0 14px 25px
        rgba(0,0,0,.35);

    transition:
        .12s;

}


#connectButton:active {

    transform:
        translateY(6px);

    box-shadow:
        0 2px 0 #2454aa;

}


#connectMessage {

    min-height: 20px;

}


/* =====================================================
   GAMEPAD
===================================================== */

#gamepad {

    display: none;

    position: relative;

    width: 100vw;
    height: 100vh;

}


/* =====================================================
   PANNEAU PRINCIPAL
===================================================== */

#gamepad::before {

    content: "";

    position: absolute;

    inset: 3% 2%;

    border-radius: 55px;

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.09),
            rgba(255,255,255,.025)
        );

    border:
        1px solid
        rgba(255,255,255,.13);

    box-shadow:
        0 35px 80px
        rgba(0,0,0,.35),
        inset 0 1px 0
        rgba(255,255,255,.12);

    backdrop-filter:
        blur(12px);

}


/* =====================================================
   ÉCRAN CENTRAL
===================================================== */

#padScreen {

    position: absolute;

    left: 50%;
    top: 50%;

    transform:
        translate(-50%, -50%);

    width: 31vw;
    max-width: 420px;

    min-width: 280px;

    height: 20vw;
    max-height: 270px;

    min-height: 180px;

    border-radius: 28px;

    background:
        linear-gradient(
            145deg,
            #ffffff,
            #e9edf5
        );

    color: #111;

    border:
        5px solid
        rgba(20,25,40,.75);

    box-shadow:

        0 18px 0
        rgba(0,0,0,.35),

        0 30px 60px
        rgba(0,0,0,.4),

        inset 0 2px 3px
        rgba(255,255,255,.9);

    padding: 20px;

    text-align: center;

    z-index: 5;

}


#padScreenTitle {

    font-size: 13px;

    font-weight: bold;

    color: #737987;

    letter-spacing: 3px;

    text-transform: uppercase;

}


#padScreenGame {

    margin-top: 20px;

    font-size: 36px;

    font-weight: 800;

}


#padScreenHelp {

    margin-top: 16px;

    font-size: 11px;

    color: #7b808b;

}


/* =====================================================
   BOUTONS 3D GÉNÉRIQUES
===================================================== */

button {

    -webkit-appearance: none;

    border: none;

    outline: none;

    cursor: pointer;

}


.face,
.dpad,
.extra,
.system {

    position: relative;

    color: white;

    background:
        linear-gradient(
            145deg,
            #3b4658,
            #171e2a
        );

    border:
        1px solid
        rgba(255,255,255,.16);

    box-shadow:

        0 8px 0
        #0b0f15,

        0 12px 22px
        rgba(0,0,0,.45),

        inset 0 2px 2px
        rgba(255,255,255,.14),

        inset 0 -4px 5px
        rgba(0,0,0,.3);

    transition:
        transform .08s,
        box-shadow .08s,
        filter .08s;

}


.face:active,
.dpad:active,
.extra:active,
.system:active {

    transform:
        translateY(6px);

    box-shadow:

        0 2px 0
        #0b0f15,

        0 5px 10px
        rgba(0,0,0,.3),

        inset 0 2px 3px
        rgba(0,0,0,.25);

    filter:
        brightness(1.25);

}


/* =====================================================
   STICK
===================================================== */

#stick {

    position: absolute;

    left: 7vw;
    top: 50%;

    transform:
        translateY(-50%);

    width: 180px;
    height: 180px;

    border-radius: 50%;

    background:
        radial-gradient(
            circle,
            #222c3c 0%,
            #121923 65%,
            #080c12 100%
        );

    border:
        4px solid
        rgba(255,255,255,.1);

    box-shadow:

        inset 0 10px 20px
        rgba(0,0,0,.6),

        inset 0 -5px 10px
        rgba(255,255,255,.04),

        0 18px 30px
        rgba(0,0,0,.45);

}


#stick::after {

    content: "";

    position: absolute;

    left: 15%;
    top: 12%;

    width: 70%;
    height: 35%;

    border-radius: 50%;

    background:
        rgba(255,255,255,.04);

    filter:
        blur(8px);

}


#stickKnob {

    position: absolute;

    left: 50%;
    top: 50%;

    width: 84px;
    height: 84px;

    margin-left: -42px;
    margin-top: -42px;

    border-radius: 50%;

    background:
        linear-gradient(
            145deg,
            #6cb0ff,
            #275ed0
        );

    border:
        3px solid
        rgba(255,255,255,.25);

    box-shadow:

        0 9px 0 #183d8b,

        0 15px 25px
        rgba(0,0,0,.5),

        inset 0 5px 8px
        rgba(255,255,255,.3),

        inset 0 -8px 10px
        rgba(0,0,0,.2);

    transition:
        transform .05s;

}


/* =====================================================
   D-PAD
===================================================== */

#dpad {

    position: absolute;

    left: 27vw;
    bottom: 9vh;

    width: 155px;
    height: 155px;

}


.dpad {

    position: absolute;

    width: 53px;
    height: 53px;

    border-radius: 14px;

    font-size: 21px;

    font-weight: bold;

}


#dpadUp {

    left: 51px;
    top: 0;

}


#dpadLeft {

    left: 0;
    top: 51px;

}


#dpadRight {

    right: 0;
    top: 51px;

}


#dpadDown {

    left: 51px;
    bottom: 0;

}


/* centre D-pad */

#dpad::after {

    content: "";

    position: absolute;

    left: 51px;
    top: 51px;

    width: 53px;
    height: 53px;

    border-radius: 14px;

    background:
        linear-gradient(
            145deg,
            #263141,
            #121821
        );

    box-shadow:
        inset 0 3px 5px
        rgba(255,255,255,.05);

    pointer-events: none;

}


/* =====================================================
   A B X Y
===================================================== */

#faceButtons {

    position: absolute;

    right: 6vw;
    top: 50%;

    transform:
        translateY(-50%);

    width: 215px;
    height: 215px;

}


.face {

    position: absolute;

    width: 70px;
    height: 70px;

    border-radius: 50%;

    font-size: 21px;

    font-weight: 900;

}


#buttonY {

    left: 72px;
    top: 0;

}


#buttonX {

    left: 0;
    top: 72px;

}


#buttonB {

    right: 0;
    top: 72px;

}


#buttonA {

    left: 72px;
    bottom: 0;

}


/* couleurs des boutons */

#buttonA {

    background:
        linear-gradient(
            145deg,
            #62df8b,
            #218b4c
        );

    box-shadow:
        0 8px 0 #14572f,
        0 13px 22px rgba(0,0,0,.45),
        inset 0 3px 3px rgba(255,255,255,.25);

}


#buttonB {

    background:
        linear-gradient(
            145deg,
            #ff6868,
            #b62939
        );

    box-shadow:
        0 8px 0 #741b26,
        0 13px 22px rgba(0,0,0,.45),
        inset 0 3px 3px rgba(255,255,255,.25);

}


#buttonX {

    background:
        linear-gradient(
            145deg,
            #70b6ff,
            #326bc3
        );

    box-shadow:
        0 8px 0 #1d4787,
        0 13px 22px rgba(0,0,0,.45),
        inset 0 3px 3px rgba(255,255,255,.25);

}


#buttonY {

    background:
        linear-gradient(
            145deg,
            #ffd65e,
            #c28b17
        );

    box-shadow:
        0 8px 0 #76530a,
        0 13px 22px rgba(0,0,0,.45),
        inset 0 3px 3px rgba(255,255,255,.25);

}


/* =====================================================
   START / SELECT
===================================================== */

#systemButtons {

    position: absolute;

    top: 5vh;
    left: 50%;

    transform:
        translateX(-50%);

    display: flex;

    gap: 15px;

    z-index: 10;

}


.system {

    min-width: 90px;

    height: 40px;

    padding:
        0 20px;

    border-radius: 20px;

    font-size: 10px;

    font-weight: bold;

}


/* =====================================================
   BOUTONS HOME / MENU / QUITTER
===================================================== */

#extraButtons {

    position: absolute;

    left: 50%;

    bottom: 4vh;

    transform:
        translateX(-50%);

    display: flex;

    gap: 12px;

}


.extra {

    height: 42px;

    padding:
        0 20px;

    border-radius: 21px;

    font-size: 10px;

    font-weight: bold;

}


#homeButton {

    background:
        linear-gradient(
            145deg,
            #7c75ff,
            #4a43b8
        );

    box-shadow:
        0 6px 0 #302b78,
        0 10px 20px rgba(0,0,0,.35);

}


#quitButton {

    background:
        linear-gradient(
            145deg,
            #ff6464,
            #a92534
        );

    box-shadow:
        0 6px 0 #681923,
        0 10px 20px rgba(0,0,0,.35);

}


/* =====================================================
   FERMER
===================================================== */

#closeButton {

    position: absolute;

    top: 5vh;
    right: 4vw;

    width: 44px;
    height: 44px;

    border-radius: 50%;

    background:
        linear-gradient(
            145deg,
            #3c4657,
            #151b25
        );

    color: white;

    font-size: 22px;

    box-shadow:
        0 6px 0 #0b0e13,
        0 10px 20px rgba(0,0,0,.4),
        inset 0 2px 2px rgba(255,255,255,.15);

}


/* =====================================================
   MESSAGE ROTATION
===================================================== */

#rotateScreen {

    display: none;

    position: fixed;

    inset: 0;

    z-index: 9999;

    align-items: center;

    justify-content: center;

    text-align: center;

    background:
        linear-gradient(
            135deg,
            #151b42,
            #4c286b
        );

    padding: 35px;

    font-size: 22px;

    font-weight: bold;

}


@media(
    orientation: portrait
) {

    #rotateScreen {

        display: flex;

    }

}


/* =====================================================
   PETITS ECRANS
===================================================== */

@media(max-width: 950px) {

    #stick {

        left: 5vw;

        width: 145px;
        height: 145px;

    }


    #stickKnob {

        width: 70px;
        height: 70px;

        margin-left: -35px;
        margin-top: -35px;

    }


    #dpad {

        left: 23vw;

        transform:
            scale(.85);

        transform-origin:
            bottom left;

    }


    #faceButtons {

        right: 4vw;

        transform:
            translateY(-50%)
            scale(.85);

        transform-origin:
            center right;

    }


    #padScreen {

        width: 32vw;

        min-width: 240px;

    }

}


/* =====================================================
   PETIT ECRAN
===================================================== */

@media(max-height: 600px) {

    #stick {

        width: 125px;
        height: 125px;

    }


    #stickKnob {

        width: 62px;
        height: 62px;

        margin-left: -31px;
        margin-top: -31px;

    }


    #faceButtons {

        transform:
            translateY(-50%)
            scale(.72);

    }


    #dpad {

        transform:
            scale(.72);

    }


    #extraButtons {

        bottom: 2vh;

    }

}

</style>

</head>


<body>


<!-- =====================================================
     CONNEXION
===================================================== -->

<section id="connectScreen">

    <div class="connectBox">

        <h1>
            🎮 DualPlay
        </h1>

        <p>
            GamePad
        </p>

        <input
            id="codeInput"
            type="tel"
            inputmode="numeric"
            maxlength="6"
            placeholder="000000"
        >

        <button
            id="connectButton">
            CONNECTER
        </button>

        <p
            id="connectMessage">
        </p>

    </div>

</section>


<!-- =====================================================
     GAMEPAD
===================================================== -->

<section id="gamepad">


    <!-- FERMER -->

    <button
        id="closeButton">
        ×
    </button>


    <!-- START / SELECT -->

    <div id="systemButtons">

        <button
            class="system"
            id="select">
            SELECT
        </button>

        <button
            class="system"
            id="start">
            START
        </button>

    </div>


    <!-- ECRAN CENTRAL -->

    <div id="padScreen">

        <div id="padScreenTitle">
            DUALPLAY GAMEPAD
        </div>

        <div id="padScreenGame">
            🐍 Snake
        </div>

        <div id="padScreenHelp">
            ◀ ▶ CHOISIR &nbsp; • &nbsp;
            A LANCER &nbsp; • &nbsp;
            B RETOUR
        </div>

    </div>


    <!-- STICK -->

    <div id="stick">

        <div id="stickKnob"></div>

    </div>


    <!-- D-PAD -->

    <div id="dpad">

        <button
            class="dpad"
            id="dpadUp"
            data-button="up">
            ▲
        </button>

        <button
            class="dpad"
            id="dpadLeft"
            data-button="left">
            ◀
        </button>

        <button
            class="dpad"
            id="dpadRight"
            data-button="right">
            ▶
        </button>

        <button
            class="dpad"
            id="dpadDown"
            data-button="down">
            ▼
        </button>

    </div>


    <!-- A B X Y -->

    <div id="faceButtons">

        <button
            class="face"
            id="buttonY"
            data-button="Y">
            Y
        </button>

        <button
            class="face"
            id="buttonX"
            data-button="X">
            X
        </button>

        <button
            class="face"
            id="buttonB"
            data-button="B">
            B
        </button>

        <button
            class="face"
            id="buttonA"
            data-button="A">
            A
        </button>

    </div>


    <!-- BOUTONS DU BAS -->

    <div id="extraButtons">

        <button
            class="extra"
            id="homeButton">
            HOME
        </button>

        <button
            class="extra"
            id="menuButton">
            MENU
        </button>

        <button
            class="extra"
            id="quitButton">
            QUITTER
        </button>

    </div>


</section>


<!-- =====================================================
     ROTATION
===================================================== -->

<div id="rotateScreen">

    📱

    <br><br>

    Tournez votre téléphone
    à l'horizontale pour utiliser
    le GamePad.

</div>


<script
    type="module"
    src="controller.js">
</script>

</body>

</html>
