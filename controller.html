<!DOCTYPE html>
<html lang="fr">

<head>
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>

<title>DualPlay GamePad</title>

<style>

/* =========================================================
   BASE
========================================================= */

* {
    box-sizing: border-box;
    user-select: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    width: 100%;
    height: 100%;
    margin: 0;
    overflow: hidden;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    touch-action: none;
}

body {

    color: white;

    background:
        linear-gradient(
            120deg,
            #171d4b,
            #49276e,
            #146c79,
            #273c83,
            #671e62
        );

    background-size: 500% 500%;

    animation:
        backgroundAnimation 18s ease infinite;
}


@keyframes backgroundAnimation {

    0% {
        background-position: 0% 50%;
    }

    25% {
        background-position: 100% 25%;
    }

    50% {
        background-position: 100% 80%;
    }

    75% {
        background-position: 20% 100%;
    }

    100% {
        background-position: 0% 50%;
    }
}


/* lumières */

body::before {

    content: "";

    position: fixed;

    width: 70vw;
    height: 70vw;

    left: -20vw;
    top: -20vw;

    border-radius: 50%;

    background:
        radial-gradient(
            circle,
            rgba(80,150,255,.22),
            transparent 65%
        );

    pointer-events: none;

    animation:
        lightMove 10s ease-in-out infinite alternate;
}


body::after {

    content: "";

    position: fixed;

    width: 65vw;
    height: 65vw;

    right: -20vw;
    bottom: -20vw;

    border-radius: 50%;

    background:
        radial-gradient(
            circle,
            rgba(255,80,200,.20),
            transparent 65%
        );

    pointer-events: none;

    animation:
        lightMove2 12s ease-in-out infinite alternate;
}


@keyframes lightMove {

    from {
        transform: translate(0,0);
    }

    to {
        transform: translate(20vw,15vh);
    }
}


@keyframes lightMove2 {

    from {
        transform: translate(0,0);
    }

    to {
        transform: translate(-15vw,-10vh);
    }
}


/* =========================================================
   CONNEXION
========================================================= */

#connectScreen {

    position: fixed;

    inset: 0;

    display: flex;

    align-items: center;
    justify-content: center;

    z-index: 1000;
}


.connectBox {

    width: 420px;
    max-width: 90%;

    padding: 38px;

    text-align: center;

    border-radius: 30px;

    background:
        rgba(14,18,35,.88);

    border:
        1px solid
        rgba(255,255,255,.16);

    box-shadow:
        0 30px 80px
        rgba(0,0,0,.45),

        inset 0 1px 0
        rgba(255,255,255,.12);

    backdrop-filter:
        blur(25px);

    -webkit-backdrop-filter:
        blur(25px);
}


.connectBox h1 {

    margin: 0;

    font-size: 40px;

    letter-spacing: -1px;
}


.connectBox p {

    color:
        rgba(255,255,255,.60);

    font-size: 14px;
}


#codeInput {

    width: 100%;
    height: 60px;

    margin-top: 18px;

    padding: 0 15px;

    border: 0;
    outline: none;

    border-radius: 17px;

    background:
        rgba(0,0,0,.35);

    color: white;

    text-align: center;

    font-size: 28px;

    font-weight: bold;

    letter-spacing: 8px;

    box-shadow:
        inset 0 4px 10px
        rgba(0,0,0,.45);
}


#connectButton {

    width: 100%;
    height: 58px;

    margin-top: 16px;

    border: 0;

    border-radius: 17px;

    color: white;

    font-size: 15px;

    font-weight: bold;

    background:
        linear-gradient(
            145deg,
            #6db5ff,
            #346ee5
        );

    box-shadow:
        0 7px 0 #214b9c,
        0 13px 25px
        rgba(0,0,0,.35),

        inset 0 2px 2px
        rgba(255,255,255,.30);

    transition:
        transform .08s,
        box-shadow .08s;
}


#connectButton:active {

    transform:
        translateY(6px);

    box-shadow:
        0 1px 0 #214b9c,
        0 5px 10px
        rgba(0,0,0,.25);
}


#connectMessage {

    min-height: 20px;

    margin-bottom: 0;
}


/* =========================================================
   GAMEPAD
========================================================= */

#gamepad {

    display: none;

    position: relative;

    width: 100vw;
    height: 100vh;

    overflow: hidden;
}


/* corps du GamePad */

#gamepad::before {

    content: "";

    position: absolute;

    left: 2%;
    right: 2%;

    top: 3%;
    bottom: 3%;

    border-radius: 50px;

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.10),
            rgba(255,255,255,.025)
        );

    border:
        1px solid
        rgba(255,255,255,.13);

    box-shadow:
        0 35px 80px
        rgba(0,0,0,.35),

        inset 0 1px 0
        rgba(255,255,255,.12);

    backdrop-filter:
        blur(10px);

    -webkit-backdrop-filter:
        blur(10px);
}


/* =========================================================
   ÉCRAN
========================================================= */

#padScreen {

    position: absolute;

    left: 50%;
    top: 50%;

    transform:
        translate(-50%, -50%);

    width: 31vw;
    max-width: 420px;
    min-width: 260px;

    height: 20vw;
    max-height: 270px;
    min-height: 175px;

    padding: 22px;

    z-index: 10;

    color: #111;

    text-align: center;

    border-radius: 27px;

    background:
        linear-gradient(
            145deg,
            #ffffff,
            #e7ebf2
        );

    border:
        5px solid
        rgba(20,25,35,.75);

    box-shadow:

        0 16px 0
        rgba(0,0,0,.35),

        0 28px 55px
        rgba(0,0,0,.45),

        inset 0 2px 3px
        rgba(255,255,255,.9);
}


#padScreenTitle {

    margin-top: 3px;

    font-size: 12px;

    font-weight: 800;

    color: #747a86;

    letter-spacing: 3px;
}


#padScreenGame {

    margin-top: 18px;

    font-size: 34px;

    font-weight: 900;
}


#padScreenHelp {

    margin-top: 15px;

    color: #777d88;

    font-size: 10px;
}


/* =========================================================
   BOUTONS 3D
========================================================= */

.face,
.dpad,
.extra,
.system {

    border: 0;

    color: white;

    background:
        linear-gradient(
            145deg,
            #414c5e,
            #171e2a
        );

    border:
        1px solid
        rgba(255,255,255,.13);

    box-shadow:

        0 7px 0 #090d13,

        0 12px 22px
        rgba(0,0,0,.40),

        inset 0 2px 2px
        rgba(255,255,255,.15),

        inset 0 -5px 8px
        rgba(0,0,0,.25);

    transition:
        transform .07s,
        filter .07s;
}


.face:active,
.dpad:active,
.extra:active,
.system:active {

    transform:
        translateY(5px);

    filter:
        brightness(1.25);
}


/* =========================================================
   JOYSTICK
========================================================= */

#stick {

    position: absolute;

    left: 6vw;
    top: 50%;

    transform:
        translateY(-50%);

    width: 175px;
    height: 175px;

    z-index: 6;

    border-radius: 50%;

    background:
        radial-gradient(
            circle,
            #273345 0%,
            #151c27 62%,
            #080c12 100%
        );

    border:
        4px solid
        rgba(255,255,255,.09);

    box-shadow:

        inset 0 10px 20px
        rgba(0,0,0,.60),

        inset 0 -5px 10px
        rgba(255,255,255,.04),

        0 18px 30px
        rgba(0,0,0,.45);
}


#stickKnob {

    position: absolute;

    left: 50%;
    top: 50%;

    width: 82px;
    height: 82px;

    margin-left: -41px;
    margin-top: -41px;

    border-radius: 50%;

    background:
        linear-gradient(
            145deg,
            #72b9ff,
            #2a61d0
        );

    border:
        3px solid
        rgba(255,255,255,.24);

    box-shadow:

        0 8px 0 #183d8a,

        0 15px 25px
        rgba(0,0,0,.5),

        inset 0 5px 8px
        rgba(255,255,255,.3),

        inset 0 -8px 10px
        rgba(0,0,0,.20);

    transition:
        transform .04s;
}


/* =========================================================
   D-PAD
========================================================= */

#dpad {

    position: absolute;

    left: 26vw;
    bottom: 10vh;

    width: 155px;
    height: 155px;

    z-index: 7;
}


.dpad {

    position: absolute;

    width: 52px;
    height: 52px;

    border-radius: 13px;

    font-size: 20px;

    font-weight: 900;
}


#dpadUp {

    left: 51px;
    top: 0;
}


#dpadLeft {

    left: 0;
    top: 51px;
}


#dpadRight {

    right: 0;
    top: 51px;
}


#dpadDown {

    left: 51px;
    bottom: 0;
}


/* =========================================================
   A B X Y
========================================================= */

#faceButtons {

    position: absolute;

    right: 6vw;
    top: 50%;

    width: 210px;
    height: 210px;

    transform:
        translateY(-50%);

    z-index: 8;
}


.face {

    position: absolute;

    width: 68px;
    height: 68px;

    border-radius: 50%;

    font-size: 21px;

    font-weight: 900;
}


/* Y */

#buttonY {

    left: 71px;
    top: 0;

    background:
        linear-gradient(
            145deg,
            #ffe067,
            #bd8918
        );

    box-shadow:
        0 7px 0 #71530d,
        0 12px 22px rgba(0,0,0,.4),
        inset 0 3px 3px rgba(255,255,255,.28);
}


/* X */

#buttonX {

    left: 0;
    top: 71px;

    background:
        linear-gradient(
            145deg,
            #72baff,
            #326cc4
        );

    box-shadow:
        0 7px 0 #1e4785,
        0 12px 22px rgba(0,0,0,.4),
        inset 0 3px 3px rgba(255,255,255,.28);
}


/* B */

#buttonB {

    right: 0;
    top: 71px;

    background:
        linear-gradient(
            145deg,
            #ff6b6b,
            #b52b3b
        );

    box-shadow:
        0 7px 0 #721c27,
        0 12px 22px rgba(0,0,0,.4),
        inset 0 3px 3px rgba(255,255,255,.28);
}


/* A */

#buttonA {

    left: 71px;
    bottom: 0;

    background:
        linear-gradient(
            145deg,
            #67e18e,
            #238b4d
        );

    box-shadow:
        0 7px 0 #14572f,
        0 12px 22px rgba(0,0,0,.4),
        inset 0 3px 3px rgba(255,255,255,.28);
}


/* =========================================================
   START / SELECT
========================================================= */

#systemButtons {

    position: absolute;

    top: 5vh;
    left: 50%;

    transform:
        translateX(-50%);

    display: flex;

    gap: 14px;

    z-index: 20;
}


.system {

    min-width: 88px;

    height: 39px;

    padding: 0 18px;

    border-radius: 20px;

    font-size: 10px;

    font-weight: 800;
}


/* =========================================================
   HOME / MENU / QUITTER
========================================================= */

#extraButtons {

    position: absolute;

    left: 50%;
    bottom: 4vh;

    transform:
        translateX(-50%);

    display: flex;

    gap: 12px;

    z-index: 20;
}


.extra {

    height: 42px;

    padding:
        0 20px;

    border-radius: 21px;

    font-size: 10px;

    font-weight: 800;
}


#homeButton {

    background:
        linear-gradient(
            145deg,
            #817aff,
            #4b43b9
        );

    box-shadow:
        0 6px 0 #302b79,
        0 10px 20px rgba(0,0,0,.35);
}


#quitButton {

    background:
        linear-gradient(
            145deg,
            #ff6868,
            #a92937
        );

    box-shadow:
        0 6px 0 #681923,
        0 10px 20px rgba(0,0,0,.35);
}


/* =========================================================
   CROIX FERMER
========================================================= */

#closeButton {

    position: absolute;

    top: 5vh;
    right: 4vw;

    width: 44px;
    height: 44px;

    z-index: 30;

    border: 0;

    border-radius: 50%;

    color: white;

    font-size: 22px;

    background:
        linear-gradient(
            145deg,
            #424c5d,
            #151b25
        );

    box-shadow:
        0 6px 0 #0b0e13,
        0 10px 20px rgba(0,0,0,.4),
        inset 0 2px 2px rgba(255,255,255,.15);
}


/* =========================================================
   ROTATION
========================================================= */

#rotateScreen {

    display: none;

    position: fixed;

    inset: 0;

    z-index: 9999;

    align-items: center;
    justify-content: center;

    text-align: center;

    padding: 30px;

    font-size: 21px;

    font-weight: bold;

    background:
        linear-gradient(
            135deg,
            #151b42,
            #4c286b
        );
}


@media (orientation: portrait) {

    #rotateScreen {
        display: flex;
    }

}


/* =========================================================
   PETITS ÉCRANS
========================================================= */

@media (max-width: 950px) {

    #stick {

        left: 4vw;

        width: 145px;
        height: 145px;
    }


    #stickKnob {

        width: 70px;
        height: 70px;

        margin-left: -35px;
        margin-top: -35px;
    }


    #dpad {

        left: 22vw;

        transform:
            scale(.82);

        transform-origin:
            bottom left;
    }


    #faceButtons {

        right: 3vw;

        transform:
            translateY(-50%)
            scale(.82);

        transform-origin:
            center right;
    }


    #padScreen {

        width: 30vw;

        min-width: 230px;
    }

}


/* =========================================================
   ÉCRANS PEU HAUTS
========================================================= */

@media (max-height: 620px) {

    #stick {

        width: 125px;
        height: 125px;
    }


    #stickKnob {

        width: 62px;
        height: 62px;

        margin-left: -31px;
        margin-top: -31px;
    }


    #dpad {

        transform:
            scale(.70);

        transform-origin:
            bottom left;
    }


    #faceButtons {

        transform:
            translateY(-50%)
            scale(.70);
    }


    #extraButtons {

        bottom: 2vh;
    }

}


/* =========================================================
   TRÈS PETITS ÉCRANS
========================================================= */

@media (max-width: 700px) {

    #padScreen {

        min-width: 210px;
        min-height: 150px;

        height: 170px;

        padding: 15px;
    }


    #padScreenGame {

        font-size: 26px;

        margin-top: 12px;
    }


    #padScreenHelp {

        font-size: 9px;
    }


    #stick {

        left: 3vw;

        width: 115px;
        height: 115px;
    }


    #stickKnob {

        width: 58px;
        height: 58px;

        margin-left: -29px;
        margin-top: -29px;
    }

}

</style>

</head>


<body>


<!-- =========================================================
     ÉCRAN DE CONNEXION
========================================================= -->

<section id="connectScreen">

    <div class="connectBox">

        <h1>
            🎮 DualPlay
        </h1>

        <p>
            GamePad
        </p>

        <input
            id="codeInput"
            type="tel"
            inputmode="numeric"
            maxlength="6"
            placeholder="000000"
        >

        <button
            id="connectButton">
            CONNECTER
        </button>

        <p id="connectMessage"></p>

    </div>

</section>


<!-- =========================================================
     GAMEPAD
========================================================= -->

<section id="gamepad">


    <!-- FERMER -->

    <button
        id="closeButton">
        ×
    </button>


    <!-- SELECT / START -->

    <div id="systemButtons">

        <button
            class="system"
            id="select">

            SELECT

        </button>


        <button
            class="system"
            id="start">

            START

        </button>

    </div>


    <!-- ÉCRAN CENTRAL -->

    <div id="padScreen">

        <div id="padScreenTitle">

            DUALPLAY GAMEPAD

        </div>


        <div id="padScreenGame">

            🐍 Snake

        </div>


        <div id="padScreenHelp">

            ◀ ▶ CHOISIR
            &nbsp; • &nbsp;
            A LANCER
            &nbsp; • &nbsp;
            B RETOUR

        </div>

    </div>


    <!-- =====================================================
         JOYSTICK
    ====================================================== -->

    <div id="stick">

        <div id="stickKnob"></div>

    </div>


    <!-- =====================================================
         D-PAD
    ====================================================== -->

    <div id="dpad">


        <button
            class="dpad"
            id="dpadUp"
            data-button="up">

            ▲

        </button>


        <button
            class="dpad"
            id="dpadLeft"
            data-button="left">

            ◀

        </button>


        <button
            class="dpad"
            id="dpadRight"
            data-button="right">

            ▶

        </button>


        <button
            class="dpad"
            id="dpadDown"
            data-button="down">

            ▼

        </button>


    </div>


    <!-- =====================================================
         A / B / X / Y
    ====================================================== -->

    <div id="faceButtons">


        <button
            class="face"
            id="buttonY"
            data-button="Y">

            Y

        </button>


        <button
            class="face"
            id="buttonX"
            data-button="X">

            X

        </button>


        <button
            class="face"
            id="buttonB"
            data-button="B">

            B

        </button>


        <button
            class="face"
            id="buttonA"
            data-button="A">

            A

        </button>


    </div>


    <!-- =====================================================
         BOUTONS BAS
    ====================================================== -->

    <div id="extraButtons">


        <button
            class="extra"
            id="homeButton">

            HOME

        </button>


        <button
            class="extra"
            id="menuButton">

            MENU

        </button>


        <button
            class="extra"
            id="quitButton">

            QUITTER

        </button>


    </div>


</section>


<!-- =========================================================
     ROTATION
========================================================= -->

<div id="rotateScreen">

    <div>

        📱↔️

        <br><br>

        Tournez votre téléphone
        à l'horizontale pour utiliser
        le GamePad.

    </div>

</div>


<!-- =========================================================
     JAVASCRIPT
========================================================= -->

<script
    type="module"
    src="controller.js">
</script>


</body>

</html>
