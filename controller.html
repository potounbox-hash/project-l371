<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>

<title>DualPlay Controller</title>

<style>

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #080a0f;
    color: white;
    font-family: Arial, Helvetica, sans-serif;
    touch-action: none;
}


/* ========================================
   ÉCRAN DE CONNEXION
======================================== */

#connectScreen {

    width: 100vw;
    height: 100vh;

    display: flex;
    align-items: center;
    justify-content: center;

    background: #080a0f;
}


.connectBox {

    width: 90%;
    max-width: 430px;

    padding: 35px;

    background: #121722;

    border-radius: 24px;

    text-align: center;

    box-shadow: 0 20px 60px rgba(0,0,0,.5);
}


.connectBox h1 {

    margin: 0 0 8px;

    font-size: 36px;
}


.connectBox p {

    color: #858b96;
}


#codeInput {

    width: 100%;

    padding: 16px;

    margin-top: 15px;

    border: 2px solid #252d3a;

    border-radius: 14px;

    outline: none;

    background: #080a0f;

    color: white;

    text-align: center;

    font-size: 28px;

    letter-spacing: 8px;
}


#codeInput:focus {

    border-color: #4d9cff;
}


#connectButton {

    width: 100%;

    margin-top: 15px;

    padding: 17px;

    border: none;

    border-radius: 14px;

    background: #4d9cff;

    color: white;

    font-size: 17px;

    font-weight: bold;
}


#connectMessage {

    min-height: 20px;

    margin-top: 15px;

}


/* ========================================
   MANETTE
======================================== */

#controller {

    display: none;

    position: relative;

    width: 100vw;
    height: 100vh;

    overflow: hidden;

    background:
        radial-gradient(
            circle at center,
            #111722 0%,
            #080a0f 70%
        );
}


/* ========================================
   BARRE DU HAUT
======================================== */

#topBar {

    position: absolute;

    left: 50%;
    top: 18px;

    transform: translateX(-50%);

    display: flex;

    align-items: center;

    gap: 14px;

    z-index: 20;
}


.systemButton {

    border: none;

    padding: 9px 20px;

    border-radius: 20px;

    background: #1c2430;

    color: white;

    font-size: 12px;

    font-weight: bold;
}


.systemButton:active {

    background: #4d9cff;

    transform: scale(.92);
}


/* ========================================
   JEU SELECTIONNE
======================================== */

#gameSelector {

    position: absolute;

    top: 67px;

    left: 50%;

    transform: translateX(-50%);

    text-align: center;

    z-index: 10;

    white-space: nowrap;
}


#selectedGame {

    font-size: 24px;

    font-weight: bold;
}


#selectorHelp {

    margin-top: 5px;

    font-size: 11px;

    color: #707784;
}


/* ========================================
   JOYSTICK
======================================== */

#joystick {

    position: absolute;

    left: 6vw;
    bottom: 9vh;

    width: 190px;
    height: 190px;

    border-radius: 50%;

    background: #111722;

    border: 3px solid #283342;

    box-shadow:
        inset 0 0 30px rgba(0,0,0,.7),
        0 10px 30px rgba(0,0,0,.3);
}


#joystickKnob {

    position: absolute;

    left: 50%;
    top: 50%;

    width: 82px;
    height: 82px;

    margin-left: -41px;
    margin-top: -41px;

    border-radius: 50%;

    background: #4d9cff;

    box-shadow:
        0 8px 25px rgba(0,0,0,.5);

    transition: transform .04s linear;
}


/* ========================================
   D-PAD
======================================== */

#dpad {

    position: absolute;

    left: 29vw;
    bottom: 10vh;

    width: 165px;
    height: 165px;
}


.dpadButton {

    position: absolute;

    width: 55px;
    height: 55px;

    border: none;

    border-radius: 12px;

    background: #1b2330;

    color: white;

    font-size: 22px;

    box-shadow: 0 5px 15px rgba(0,0,0,.25);
}


#up {

    left: 55px;
    top: 0;
}


#left {

    left: 0;
    top: 55px;
}


#right {

    right: 0;
    top: 55px;
}


#down {

    left: 55px;
    bottom: 0;
}


.dpadButton:active {

    background: #4d9cff;

    transform: scale(.9);
}


/* ========================================
   BOUTONS A B X Y
======================================== */

#buttons {

    position: absolute;

    right: 7vw;
    bottom: 7vh;

    width: 220px;
    height: 220px;
}


.gameButton {

    position: absolute;

    width: 72px;
    height: 72px;

    border: none;

    border-radius: 50%;

    background: #1b2330;

    color: white;

    font-size: 22px;

    font-weight: bold;

    box-shadow:
        0 7px 20px rgba(0,0,0,.35);
}


#buttonY {

    left: 74px;
    top: 0;
}


#buttonX {

    left: 0;
    top: 74px;
}


#buttonB {

    right: 0;
    top: 74px;
}


#buttonA {

    left: 74px;
    bottom: 0;
}


.gameButton:active {

    background: #4d9cff;

    transform: scale(.88);
}


/* ========================================
   MESSAGE ROTATION
======================================== */

#rotateMessage {

    display: none;

    position: fixed;

    inset: 0;

    z-index: 999;

    background: #080a0f;

    align-items: center;

    justify-content: center;

    text-align: center;

    padding: 30px;
}


#rotateMessage div {

    max-width: 350px;

    font-size: 20px;

}


#rotateMessage small {

    display: block;

    margin-top: 15px;

    color: #777;
}


/* ========================================
   PETITS ECRANS
======================================== */

@media (max-height: 500px) {

    #joystick {

        width: 150px;
        height: 150px;

    }

    #joystickKnob {

        width: 65px;
        height: 65px;

        margin-left: -32.5px;
        margin-top: -32.5px;

    }

    #dpad {

        width: 135px;
        height: 135px;

    }

    .dpadButton {

        width: 45px;
        height: 45px;

    }

    #up,
    #down {

        left: 45px;

    }

    #left,
    #right {

        top: 45px;

    }

    #buttons {

        transform: scale(.8);

        transform-origin: bottom right;

    }

}

</style>
</head>


<body>


<!-- ========================================
     CONNEXION
======================================== -->

<section id="connectScreen">

    <div class="connectBox">

        <h1>🎮 DualPlay</h1>

        <p>Transformez votre téléphone en manette</p>

        <input
            id="codeInput"
            type="tel"
            inputmode="numeric"
            maxlength="6"
            autocomplete="off"
            placeholder="000000"
        >

        <button id="connectButton">
            CONNECTER
        </button>

        <div id="connectMessage"></div>

    </div>

</section>


<!-- ========================================
     MANETTE
======================================== -->

<section id="controller">


    <!-- BARRE DU HAUT -->

    <div id="topBar">

        <button
            id="select"
            class="systemButton"
        >
            SELECT
        </button>

        <button
            id="start"
            class="systemButton"
        >
            START
        </button>

    </div>


    <!-- JEU -->

    <div id="gameSelector">

        <div id="selectedGame">
            🟦 Pixel Dodge
        </div>

        <div id="selectorHelp">
            ◀ ▶ pour choisir • A pour lancer
        </div>

    </div>


    <!-- JOYSTICK -->

    <div id="joystick">

        <div id="joystickKnob"></div>

    </div>


    <!-- D-PAD -->

    <div id="dpad">

        <button
            class="dpadButton"
            id="up"
            data-button="up"
        >
            ▲
        </button>

        <button
            class="dpadButton"
            id="left"
            data-button="left"
        >
            ◀
        </button>

        <button
            class="dpadButton"
            id="right"
            data-button="right"
        >
            ▶
        </button>

        <button
            class="dpadButton"
            id="down"
            data-button="down"
        >
            ▼
        </button>

    </div>


    <!-- A B X Y -->

    <div id="buttons">

        <button
            class="gameButton"
            id="buttonY"
            data-button="Y"
        >
            Y
        </button>

        <button
            class="gameButton"
            id="buttonX"
            data-button="X"
        >
            X
        </button>

        <button
            class="gameButton"
            id="buttonB"
            data-button="B"
        >
            B
        </button>

        <button
            class="gameButton"
            id="buttonA"
            data-button="A"
        >
            A
        </button>

    </div>


</section>


<!-- ========================================
     MESSAGE SI TELEPHONE VERTICAL
======================================== -->

<div id="rotateMessage">

    <div>

        📱↔️

        <br><br>

        Tournez votre téléphone
        à l'horizontale.

        <small>
            DualPlay est conçu pour être utilisé
            en mode paysage.
        </small>

    </div>

</div>


<script
    type="module"
    src="controller.js"
></script>

</body>
</html>
