<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>DualPlay</title>

<style>
*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:Arial,Helvetica,sans-serif;
    background:#fff;
}

body{
    color:#111;
}

#app{
    width:100vw;
    height:100vh;
}

/* =========================
   EN-TÊTE
========================= */

header{
    height:65px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 25px;
    background:#fff;
    border-bottom:1px solid #ddd;
}

.logo{
    font-size:24px;
    font-weight:bold;
}

.status{
    display:flex;
    align-items:center;
    gap:8px;
    font-size:13px;
    color:#777;
}

.status-dot{
    width:10px;
    height:10px;
    border-radius:50%;
    background:#aaa;
}

.status-dot.connected{
    background:#28c76f;
}

/* =========================
   CONNEXION
========================= */

#menu{
    height:calc(100vh - 65px);
    display:flex;
    align-items:center;
    justify-content:center;
}

.menu-box{
    width:600px;
    max-width:90%;
    text-align:center;
}

.menu-box h1{
    font-size:52px;
    margin:0 0 10px;
}

.menu-box p{
    color:#777;
}

.code{
    font-size:50px;
    font-weight:bold;
    letter-spacing:10px;
    margin:30px 0;
}

.waiting{
    color:#888;
}

/* =========================
   MENU JEUX
========================= */

#gameMenu{
    display:none;
    height:calc(100vh - 65px);
    align-items:center;
    justify-content:center;
}

.game-menu-box{
    width:850px;
    max-width:90%;
}

.game-menu-box h1{
    text-align:center;
    font-size:40px;
}

.game-list{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:20px;
}

.game-card{
    border:2px solid #ddd;
    border-radius:18px;
    padding:30px 15px;
    text-align:center;
    background:white;
    transition:.15s;
}

.game-card.selected{
    border-color:#111;
    transform:scale(1.04);
    box-shadow:0 8px 30px #ddd;
}

.game-icon{
    font-size:55px;
    margin-bottom:15px;
}

.game-name{
    font-size:20px;
    font-weight:bold;
}

.game-help{
    margin-top:30px;
    text-align:center;
    color:#777;
}

/* =========================
   JEU
========================= */

#gameScreen{
    display:none;
    width:100%;
    height:calc(100vh - 65px);
    align-items:center;
    justify-content:center;
}

#gameCanvas{
    width:min(1280px,95vw);
    max-height:90%;
    aspect-ratio:16/9;
    background:#101722;
    border-radius:15px;
}

/* =========================
   MOBILE
========================= */

@media(max-width:700px){

    .game-list{
        grid-template-columns:1fr;
    }

    .menu-box h1{
        font-size:38px;
    }

}
</style>
</head>

<body>

<div id="app">

<header>
    <div class="logo">DualPlay</div>

    <div class="status">
        <div id="statusDot" class="status-dot"></div>
        <span id="statusText">Connexion...</span>
    </div>
</header>


<!-- =========================
     CONNEXION
========================= -->

<section id="menu">

    <div class="menu-box">

        <h1>DualPlay</h1>

        <p>
            Connectez votre téléphone pour commencer.
        </p>

        <div class="code" id="sessionCode">
            ------
        </div>

        <div class="waiting" id="connectionMessage">
            En attente du téléphone...
        </div>

    </div>

</section>


<!-- =========================
     MENU DES JEUX
========================= -->

<section id="gameMenu">

    <div class="game-menu-box">

        <h1>Choisissez votre jeu</h1>

        <div class="game-list">

            <div class="game-card" data-game="dodge">
                <div class="game-icon">🟦</div>
                <div class="game-name">
                    Pixel Dodge
                </div>
            </div>

            <div class="game-card" data-game="snake">
                <div class="game-icon">🐍</div>
                <div class="game-name">
                    Snake
                </div>
            </div>

            <div class="game-card" data-game="pong">
                <div class="game-icon">🏓</div>
                <div class="game-name">
                    Pong
                </div>
            </div>

        </div>

        <div class="game-help">
            Utilisez votre téléphone pour choisir • A pour lancer
        </div>

    </div>

</section>


<!-- =========================
     JEU
========================= -->

<section id="gameScreen">

    <canvas
        id="gameCanvas"
        width="1280"
        height="720">
    </canvas>

</section>

</div>

<script type="module" src="app.js"></script>

</body>
</html>
