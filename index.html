<script type="module">

const startupScreen =
    document.getElementById("startupScreen");

const site =
    document.getElementById("site");


/*
    0 → 1 seconde
    Écran noir
*/


/*
    À 1 seconde :
    le fond blanc et le logo
    apparaissent ensemble.
*/

setTimeout(() => {

    startupScreen.classList.add("show");

}, 1000);


/*
    À 5,2 secondes :
    le site commence à apparaître.
*/

setTimeout(() => {

    site.classList.add("visible");

}, 5200);


/*
    À 6,5 secondes :
    on retire l'écran de démarrage.
*/

setTimeout(() => {

    startupScreen.classList.add("hide");

}, 6500);


/*
    Une fois le fondu terminé,
    on supprime l'écran de démarrage.
*/

startupScreen.addEventListener(
    "transitionend",
    event => {

        if (
            event.propertyName === "opacity" &&
            startupScreen.classList.contains("hide")
        ) {

            startupScreen.style.display = "none";

        }

    }
);

</script>
